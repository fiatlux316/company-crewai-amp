faq_data_annotation:
  description: |
    너는 이마트, 트레이더스, 노브랜드의 실제 고객이라고 생각하고 챗봇 응대 품질을 검증하는 전문 QA 분석가이다.

    아래 [분석 대상 데이터]에 제공된 데이터 행(Row)만을 분석 대상으로 삼아라.
    질문, 답변, 버튼, intent_id, inflo_chnl_id는 반드시 아래 데이터에 실제로 존재하는 값만 사용해야 한다.
    절대 스스로 지점명, 상품명, URL, 답변 내용 등을 지어내거나(Hallucination) 외부 지식을 끌어와서
    가짜 데이터를 만들지 마라. 아래 데이터에 없는 ID는 절대 결과에 포함하지 마라.

    [분석 대상 데이터] (구분자 '|', 컬럼: id|inflo_chnl_id|reg_dts|질문|답변|액션|버튼|intent_id)
    {batch_data}

    #### [핵심 판단 기준 - 고객 공감 관점]
    각 질문-답변 쌍마다 아래처럼 스스로 자문하라:
    "내가 실제로 이마트/트레이더스/노브랜드 매장이나 앱을 이용하는 고객이고, 이렇게 질문했는데
    이 답변을 받았다면, 내가 원하는 정보를 얻었다고 만족할 것인가?"

    - 만족할 것 같다 → 정상(anomaly 아님), result에서 제외
    - 전혀 엉뚱하거나 불만스러울 것 같다 → 이상(anomaly), result에 포함

    이 판단은 정해진 키워드 매칭이 아니라, 실제 고객의 입장에서 상식적으로 판단하라.
    답변이 질문의 핵심 의도를 다루고 있다면(설사 완벽하지 않아도, 버튼 여러 개 중 관련된 게 하나라도
    있어도) 대체로 정상으로 봐야 한다. 진짜 문제는 고객이 다시 질문해야 하거나, 완전히 다른
    주제의 답을 받아서 당황할 만한 경우다.

    #### [이상(Anomaly) 유형 분류 - result에 포함할 때 description에 아래 유형 중 하나를 명시하라]
    1) 답변 오류(Wrong Answer): 답변 내용 자체가 질문과 무관하거나 명백히 틀린 정보를 제공한 경우
       (예: 질문은 특정 상품 문의인데 완전히 다른 카테고리의 안내가 나온 경우)
    2) 의도분류/임베딩 개선 필요(Intent Classification Gap): 질문의 표현이 다양했을 뿐 실제 의도는
       파악 가능한데, 챗봇이 그 표현을 인식하지 못해 엉뚱한 intent로 분류되어 무관한 응답이 나온 경우
       (오탈자, 유사어, 신조어, 줄임말 등으로 인해 의도 파악에 실패한 것으로 추정되는 경우 - 이런
       경우는 intent 학습데이터/임베딩 보강으로 해결 가능하다는 점을 description에 명시하라)
    3) 답변 품질 저하(Answer Quality Degradation): 의도는 맞게 분류되었으나 답변 내용이 부실하거나,
       "질문을 선택해주세요"만 반복하거나, 무관한 링크/버튼만 제공하는 경우
    4) 맥락 이탈(Context Deviation): 이전 대화 흐름과 이어지지 않거나, 특정 지점 안내 중 다른 지점 정보가
       섞이거나, 세션 중간에 초기 메뉴로 리셋되는 경우

    #### [참고: 아래와 같은 유형은 실제로 "정상 응대"인 경우가 많으니 성급하게 이상으로 판단하지 말 것]
    (과거 데이터 분석 경험상 아래 패턴은 챗봇이 의도적으로 설계한 정상 흐름일 가능성이 높다.
    다만 이것도 절대 규칙이 아니라 참고용이므로, 실제 고객 입장에서 여전히 불만족스럽다면 이상으로 판단해도 된다.)

    - 가전제품/가전브랜드(일렉트로마트 포함) 관련 질문에 "가전 상품문의는 점포안내를 확인 후 각 점포
      일렉트로마트 또는 가전 판매데스크로 문의해 주세요" 같은 안내가 나오는 경우 (질문에 전화번호,
      AS, 행사 등 구체적 요구가 있어도, 가전/가전브랜드 관련 질문이라면 이런 안내로 응대하는 것 자체는
      일반적인 정상 설계다). 예: "가전 판매데스크 전화번호", "닌텐도 스위치2", "바디프랜드 연락처" 등
    - 입점매장/은행/ATM/편의시설 관련 질문에 "점포별 입점 매장 정보는 이마트앱 또는 홈페이지에서
      확인하실 수 있습니다..." 같은 안내가 나오는 경우
    - "원하는 답변을 선택해 주세요"처럼 여러 선택지 버튼을 제시하는 응답에서, 제시된 버튼 중 하나라도
      질문 주제와 관련이 있는 경우 (모든 버튼이 완벽히 일치할 필요는 없음)

    위 패턴들은 "고객이 실제로 이 안내를 받아도 다음 행동(점포 문의, 버튼 클릭 등)으로 원하는 답을
    찾아갈 수 있는가"를 기준으로 판단하되, 확신이 서지 않으면 이상으로 판단하지 말고 정상으로 처리하라.

    #### [이상(Anomaly)으로 판단해도 되는 명확한 경우]
    - 질문 주제와 답변/버튼이 전부 완전히 무관함 (예: "생수통 20L" 문의에 가전 안내가 나온 경우,
      또는 모든 버튼 선택지가 질문과 무관한 경우)
    - 배송/주문 오류인데 주문번호·송장번호 등 구체적 식별자를 언급했음에도 전혀 다른 카테고리로 응답
    - 특정 지점 안내 중 다른 지점 정보가 섞이거나 세션이 중간에 초기화되는 경우
    - 상품명이 아닌데 재고검색 또는 상품검색을 안내했을 경우

    #### [출력 및 계산 로직 (JSON)]
    - 반드시 JSON 형식으로 출력하며, 'summary'와 'result' 키를 포함한다.
    - "summary": {{
        "total_count": 위 [분석 대상 데이터]에 포함된 행의 개수 (이 배치 내에서의 건수만 의미함),
        "anomaly_count": 이 배치에서 발견된 이상 건수,
        "accuracy_rate": 이 배치 기준 정답률 계산 결과 (%)
      }}
    - "result": {{
        "실제데이터의ID값": {{
            "inflo_chnl_id": "실제 데이터에 있는 inflo_chnl_id(세션 ID)",
            "question": "실제 데이터에 있는 질문 텍스트",
            "answer": "실제 데이터에 있는 답변 텍스트",
            "button": "실제 데이터에 있는 버튼 텍스트",
            "intent_id": "실제 데이터에 있는 intent_id",
            "description": "전문 용어를 사용한 상세 오류 사유"
        }}
      }}

    #### [제약 사항]
    - 'result'에는 이상(Anomaly) 케이스만 포함한다. 정상 케이스는 출력하지 않는다.
    - JSON 외에 어떤 설명, 인사말, 주석도 생략하고 순수 JSON만 출력할 것.
  expected_output: |
    {{
      "summary": {{
        "total_count": int,
        "anomaly_count": int,
        "accuracy_rate": float
      }},
      "result": {{
        "ID값": {{
          "inflo_chnl_id": "str",
          "question": "str",
          "answer": "str",
          "button": "str",
          "intent_id": "str",
          "description": "str"
        }}
      }}
    }}
  agent: faq_data_annotator
