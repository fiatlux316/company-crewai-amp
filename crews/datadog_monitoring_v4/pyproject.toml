[project]
name = "datadog_monitoring_v4"
version = "0.1.0"
description = "datadog_monitoring_v4 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools[mcp]>=1.14.7",
    "crewai[bedrock,google-genai,tools]==1.14.7",
]

[project.scripts]
datadog_monitoring_v4 = "datadog_monitoring_v4.main:run"
run_crew = "datadog_monitoring_v4.main:run"
train = "datadog_monitoring_v4.main:train"
replay = "datadog_monitoring_v4.main:replay"
test = "datadog_monitoring_v4.main:test"
run_with_trigger = "datadog_monitoring_v4.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
