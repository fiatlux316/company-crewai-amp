services:
  # API 게이트웨이
  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/gateway --reload-dir /app/crews
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/crew_amp.db
      - CREWAI_API_KEY=super-secret-company-key
      - SHARED_MCP_SERVER_URL=http://worker:8012/sse
      - SCHEDULE_RUNNER_ENABLED=true
      - WATCHFILES_FORCE_POLLING=true
      # 로컬 테스트용이므로 실제 OpenAI API 키는 주입하지 않음 (Mock Crew 실행 예정)
      - OPENAI_API_KEY=mock-key
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
    volumes:
      - shared-db:/app/data
      - ./gateway:/app/gateway
      - ./crews:/app/crews
      - ./dashboard/img:/app/dashboard/img:ro
      - ./mcp_server:/app/mcp_server
      - dashboard-dist:/app/dashboard/dist
    depends_on:
      - redis

  # 비동기 작업 큐
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # CrewAI 에이전트 실행 워커
  worker:
    build: .
    command: celery -A gateway.celery_app.celery_app worker --loglevel=info -c 2
    ports:
      - "8012:8012"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/crew_amp.db
      - OPENAI_API_KEY=mock-key
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - shared-db:/app/data
      - ./gateway:/app/gateway
      - ./crews:/app/crews
      - ./mcp_server:/app/mcp_server
    depends_on:
      - redis

  # 프론트엔드 프로덕션 빌드 전용 (1회성 빌드 -> gateway와 공유 볼륨에 dist 산출물 복사)
  # 사용법: docker compose build dashboard-builder && docker compose run --rm dashboard-builder
  dashboard-builder:
    build:
      context: .
      target: frontend-builder
    volumes:
      - dashboard-dist:/output
    command: sh -c "cp -rf /app/dashboard/dist/. /output/"

  # React 개발 서버
  dashboard:
    image: node:20-alpine
    working_dir: /app/dashboard
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://gateway:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./dashboard:/app/dashboard
      - dashboard-node-modules:/app/dashboard/node_modules
    depends_on:
      - gateway

volumes:
  shared-db:
  dashboard-node-modules:
  dashboard-dist:
